<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)" />
<title>Acompanhe seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f3f4f6; --card: #ffffff; --ink: #16171b; --muted: #5d606a; --faint: #9a9da6; --line: #e4e5e9;
    --red: #e11d2e; --red-ink: #b3121f; --red-wash: #fdecee; --ok: #0e7c4a; --ok-wash: #e7f5ee; --warn: #9a5b00; --warn-wash: #fff4e0;
    --layer-off: #e4e5e9; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f1013; --card: #17181c; --ink: #f2f2f4; --muted: #a0a3ac; --faint: #6c6f78; --line: #26272d;
      --red: #ff3347; --red-ink: #ff6b7a; --red-wash: #2a1215; --ok: #4ccf8e; --ok-wash: #10241a; --warn: #ffb547; --warn-wash: #2a2011; --layer-off: #26272d; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 Archivo, system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'tnum' 1; }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .wide { font-stretch: 125%; letter-spacing: -0.01em; }
  header.shop { display: flex; align-items: center; gap: 10px; margin: 4px 4px 22px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--red); color: #fff; display: grid; place-items: center; font: 800 13px/1 Archivo, sans-serif; font-stretch: 125%; }
  .shopname { font-weight: 700; font-stretch: 112%; font-size: 15px; }
  .hello { margin: 0 4px 2px; color: var(--muted); font-size: 15px; }
  h1 { margin: 0 4px 18px; font-size: clamp(28px, 8vw, 38px); line-height: 1.05; font-weight: 800; font-stretch: 125%; letter-spacing: -0.02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
  .hero { display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; padding: 20px 18px; }
  .hero .state { font-size: 22px; line-height: 1.15; font-weight: 800; font-stretch: 118%; margin: 0 0 6px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .hero p.state { color: var(--ink); }
  .hero strong { color: var(--ink); font-weight: 600; }
  .pct { font-size: 15px; color: var(--ink); font-weight: 600; margin-top: 8px !important; }
  svg.layers { width: 112px; height: 132px; display: block; overflow: visible; }
  .lay { fill: var(--layer-off); }
  .lay.on { fill: var(--red); }
  .nozzle { fill: var(--ink); }
  @media (prefers-reduced-motion: no-preference) { .nozzle { animation: sweep 2.4s ease-in-out infinite alternate; } }
  @keyframes sweep { from { transform: translateX(var(--from)); } to { transform: translateX(var(--to)); } }
  ol.steps { list-style: none; margin: 0; padding: 4px 2px 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); position: relative; }
  ol.steps::before { content: ''; position: absolute; top: 9px; left: calc(50% / var(--n)); right: calc(50% / var(--n)); height: 2px; background: var(--line); }
  ol.steps .bar { position: absolute; top: 9px; left: calc(50% / var(--n)); height: 2px; background: var(--red); width: var(--w); }
  ol.steps li { position: relative; text-align: center; font-size: 11.5px; color: var(--faint); padding-top: 26px; line-height: 1.25; }
  ol.steps li::before { content: ''; position: absolute; top: 2px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); box-sizing: border-box; }
  ol.steps li.done { color: var(--muted); }
  ol.steps li.done::before { background: var(--red); border-color: var(--red); }
  ol.steps li.current { color: var(--ink); font-weight: 600; }
  ol.steps li.current::before { border-color: var(--red); box-shadow: 0 0 0 4px var(--red-wash); }
  ol.steps time { display: block; font-weight: 400; color: var(--faint); font-size: 10.5px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.items li:first-child { border-top: 0; padding-top: 0; }
  .thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb span { font-weight: 800; color: var(--faint); font-size: 14px; }
  .iname { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .isub { font-size: 12.5px; color: var(--muted); }
  .mini { height: 4px; border-radius: 4px; background: var(--layer-off); margin-top: 6px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--red); border-radius: 4px; }
  .price { font-weight: 600; font-size: 14.5px; text-align: right; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 4px; }
  .total b { font-size: 24px; font-weight: 800; font-stretch: 115%; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; }
  .pill.ok { background: var(--ok-wash); color: var(--ok); }
  .pill.warn { background: var(--warn-wash); color: var(--warn); }
  .pix { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; margin-top: 14px; }
  .qr { background: #fff; border-radius: 12px; padding: 6px; border: 1px solid var(--line); }
  .qr svg { width: 100%; height: auto; display: block; }
  .pix p { margin: 0 0 10px; font-size: 13.5px; color: var(--muted); }
  button, .btn { appearance: none; border: 0; cursor: pointer; font: 600 15px/1 Archivo, system-ui, sans-serif; border-radius: 12px; padding: 14px 16px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform .08s ease, opacity .15s; }
  button:active, .btn:active { transform: scale(.985); }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: var(--red); color: #fff; }
  .secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .ghost { background: transparent; color: var(--muted); padding: 10px; }
  .wa { background: #1fa855; color: #fff; }
  .stack { display: grid; gap: 8px; margin-top: 14px; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .done-msg { display: flex; gap: 10px; align-items: flex-start; background: var(--ok-wash); color: var(--ok); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 500; margin-top: 12px; }
  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 18px; }
  .empty { text-align: center; padding: 64px 16px; }
  .empty h1 { font-size: 26px; }
  .skeleton { height: 140px; border-radius: var(--radius); background: linear-gradient(90deg, var(--card), var(--line), var(--card)); background-size: 200% 100%; animation: sh 1.4s infinite; margin-bottom: 12px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 5; }
  .sheet.show { display: flex; }
  .sheet > div { background: var(--card); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 6px; font-size: 20px; font-stretch: 115%; }
  .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  @media (max-width: 360px) { .hero { grid-template-columns: 88px 1fr; } svg.layers { width: 88px; height: 104px; } .pix { grid-template-columns: 1fr; } .qr { max-width: 200px; margin: 0 auto; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="skeleton"></div><div class="skeleton" style="height:220px"></div></main>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div><h3 id="sheet-t"></h3><p id="sheet-p"></p><div class="stack"><button class="primary" id="sheet-ok"></button><button class="ghost" id="sheet-no">Agora não</button></div></div></div>
<script>
(() => {
  // Configuração: o GitHub troca estes marcadores ao publicar; na prévia do app vem pelo endereço.
  const CFG = { url: 'https://hzlghxxxuqkaagepsdxz.supabase.co', key: 'sb_publishable_lEYgAZJSheUTjy0cVYmUHg_bVJxZ5AB' };
  const raw = location.hash.slice(1);
  const hash = new URLSearchParams(raw.includes('=') || raw === 'demo' ? raw : 't=' + raw);
  const token = (hash.get('t') || '').replace(/[^A-Za-z0-9]/g, '');
  if (hash.get('u')) CFG.url = hash.get('u');
  if (hash.get('k')) CFG.key = hash.get('k');
  const demo = hash.has('demo');
  const $app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const W = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const hm = (d) => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  function when(ms) {
    const d = new Date(ms), n = new Date(), t = new Date(n); t.setDate(n.getDate() + 1);
    if (sameDay(d, n)) return 'hoje às ' + hm(d);
    if (sameDay(d, t)) return 'amanhã às ' + hm(d);
    const days = (d - n) / 864e5;
    if (days > 0 && days < 6) return W[d.getDay()] + ' às ' + hm(d);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' + hm(d);
  }
  const shortDate = (ms) => new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const dueText = (iso) => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return W[dt.getDay()] + ', ' + dt.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
  const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} dia(s)`; };
  const initials = (s) => (s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
  let toastT;
  const toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); };

  /** A peça "sendo impressa": um vaso feito de camadas; enche de baixo para cima. */
  function layers(pct, printing) {
    const N = 22, H = 132, W = 112, gap = 2, lh = (H - gap * (N - 1)) / N;
    const on = Math.round((Math.max(0, Math.min(100, pct)) / 100) * N);
    let s = `<svg class="layers" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento: ${Math.round(pct)}%">`;
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1); // 0 = base
      const w = W * (0.46 + 0.42 * Math.sin(Math.PI * (0.18 + 0.7 * t)) - 0.12 * t);
      const y = H - (i + 1) * lh - i * gap;
      s += `<rect class="lay${i < on ? ' on' : ''}" x="${((W - w) / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${lh.toFixed(1)}" rx="${(lh / 2).toFixed(1)}"/>`;
      if (printing && i === Math.min(on, N - 1)) {
        const x0 = (W - w) / 2, x1 = x0 + w - 10;
        s += `<g style="--from:${x0.toFixed(1)}px;--to:${x1.toFixed(1)}px" class="nozzle"><rect x="0" y="${(y - 12).toFixed(1)}" width="10" height="9" rx="2"/><path d="M2 ${(y - 3).toFixed(1)} h6 l-3 3 z"/></g>`;
      }
    }
    return s + '</svg>';
  }

  function hero(d) {
    const o = d.order, live = d.live || {}, p = d.pieces;
    const base = p.total ? (p.done / p.total) * 100 : 0;
    let pct = o.status === 'ready' || o.status === 'delivered' ? 100 : o.status === 'quote' ? 0 : base;
    let title, lines = [];
    if (o.status === 'quote') {
      title = 'Seu orçamento está pronto';
      lines.push(o.validUntil ? `Vale até <strong>${shortDate(o.validUntil)}</strong>. É só aprovar aqui embaixo que a gente começa.` : 'É só aprovar aqui embaixo que a gente começa.');
    } else if (o.status === 'cancelled') {
      title = 'Pedido cancelado';
      lines.push('Se tiver alguma dúvida, fale com a loja.');
    } else if (o.status === 'delivered') {
      title = 'Entregue. Obrigado!';
      lines.push(o.deliveredAt ? `Entregue em <strong>${shortDate(o.deliveredAt)}</strong>.` : 'Seu pedido foi entregue.');
    } else if (o.status === 'ready') {
      title = 'Pronto! 🎉';
      lines.push('Suas peças estão prontas. Combine a retirada ou a entrega com a loja.');
    } else if (live.kind === 'printing') {
      title = 'Imprimindo agora';
      lines.push(`<strong>${esc(live.item || 'Sua peça')}</strong> está na impressora.`);
      if (live.pct != null) pct = Math.max(base, Math.min(99, base + (live.pct / 100) * (100 - base) * 0.5));
    } else if (live.kind === 'queued') {
      title = 'Na fila da impressora';
      lines.push('Seu pedido já está na fila de impressão.');
    } else {
      title = 'Pedido confirmado';
      lines.push('Já anotamos tudo — a impressão começa em breve.');
    }
    if (o.status === 'open' && p.done > 0) lines.push(`<strong>${p.done} de ${p.total}</strong> peças prontas.`);
    if (o.status === 'open' && d.eta) lines.push(`Previsão de ficar pronto: <strong>${when(d.eta)}</strong>.`);
    else if (o.status === 'open' && o.dueDate) lines.push(`Entrega combinada: <strong>${dueText(o.dueDate)}</strong>.`);
    const livePct = live.kind === 'printing' && live.pct != null ? `<p class="pct">${Math.round(live.pct)}% desta impressão${live.endsAt ? ' · termina ' + when(live.endsAt) : ''}</p>` : '';
    return `<section class="card hero">${layers(pct, live.kind === 'printing' && o.status === 'open')}<div><p class="state">${title}</p>${lines.map((l) => `<p>${l}</p>`).join('')}${livePct}</div></section>`;
  }

  function steps(d) {
    const st = d.steps || [];
    const n = st.length, cur = Math.max(0, st.findIndex((s) => s.state === 'current'));
    const last = st.every((s) => s.state === 'done') ? n - 1 : cur;
    const w = n > 1 ? `calc(${(last / (n - 1)) * 100}% - ${(last / (n - 1)) * (100 / n)}%)` : '0';
    return `<section class="card" aria-label="Etapas"><ol class="steps" style="--n:${n}"><span class="bar" style="--w:${w}"></span>${st
      .map((s) => `<li class="${s.state}"${s.state === 'current' ? ' aria-current="step"' : ''}>${esc(s.label)}${s.at ? `<time>${shortDate(s.at)}</time>` : ''}</li>`)
      .join('')}</ol></section>`;
  }

  function items(d) {
    const showMoney = !!d.money;
    const rows = d.items.map((i) => {
      const thumb = i.thumb ? `<img src="${esc(i.thumb)}" alt="" />` : `<span>${esc(initials(i.name))}</span>`;
      const prog = d.order.status === 'open' && i.qty > 0 ? `<div class="mini" aria-hidden="true"><i style="width:${(i.done / i.qty) * 100}%"></i></div>` : '';
      const sub = d.order.status === 'open' ? `${i.done} de ${i.qty} pronta${i.qty > 1 ? 's' : ''}` : `${i.qty} unidade${i.qty > 1 ? 's' : ''}`;
      const price = showMoney && i.unitCents != null ? `<div class="price">${brl(i.unitCents * i.qty)}</div>` : '<div></div>';
      return `<li><div class="thumb">${thumb}</div><div><div class="iname">${esc(i.qty)}× ${esc(i.name)}</div><div class="isub">${sub}</div>${prog}</div>${price}</li>`;
    }).join('');
    const total = showMoney && d.money.priced ? `<div class="total"><span>Total</span><b>${brl(d.money.totalCents)}</b></div>` : '';
    return `<section class="card"><h2>Suas peças</h2><ul class="items">${rows}</ul>${total}</section>`;
  }

  function money(d, state) {
    const m = d.money;
    if (!m || !m.priced || d.order.status === 'cancelled') return '';
    if (m.paid) return `<section class="card"><h2>Pagamento</h2><span class="pill ok">✓ Pago</span></section>`;
    const isQuote = d.order.status === 'quote';
    const amount = isQuote && m.depositCents ? m.depositCents : m.totalCents;
    const label = isQuote && m.depositCents ? `Sinal para começar: <b>${brl(m.depositCents)}</b> (o resto na entrega)` : `Valor: <b>${brl(amount)}</b>`;
    const claimed = m.clientSaidPaidAt || state.paidSent;
    let pix = '';
    if (m.pix) {
      pix = m.pix.payload
        ? `<div class="pix"><div class="qr" aria-label="QR code do PIX">${m.pix.qrSvg && /^\s*<svg[\s>]/.test(m.pix.qrSvg) && !/<script|on\w+=/i.test(m.pix.qrSvg) ? m.pix.qrSvg : ''}</div><div><p>Abra o app do banco, escolha <b>PIX → Ler QR code</b> ou use o copia e cola.</p><button class="secondary" data-copy="${esc(m.pix.payload)}">Copiar PIX copia e cola</button></div></div>`
        : `<div class="stack"><p class="note">Chave PIX: <b>${esc(m.pix.key)}</b></p><button class="secondary" data-copy="${esc(m.pix.key)}">Copiar chave PIX</button></div>`;
    }
    const paidBtn = d.actions.paid && !claimed && !isQuote ? `<div class="stack"><button class="ghost" data-act="paid">Já paguei</button></div>` : '';
    const claimedMsg = claimed ? `<div class="done-msg">✓ Obrigado! A loja vai conferir o pagamento.</div>` : '';
    return `<section class="card"><h2>Pagamento</h2><p style="margin:0">${label}</p>${!claimed ? '<span class="pill warn" style="margin-top:10px">Aguardando pagamento</span>' : ''}${pix}${paidBtn}${claimedMsg}</section>`;
  }

  function actions(d, state) {
    const o = d.order;
    const phone = (d.shop.phone || '').replace(/\D/g, '');
    const wa = phone ? `https://wa.me/${phone.length <= 11 ? '55' + phone : phone}?text=${encodeURIComponent(`Oi! Sobre o ${o.status === 'quote' ? 'orçamento' : 'pedido'} #${o.number}: `)}` : '';
    let a = '';
    if (d.actions.approve && !state.approved) a += `<button class="primary" data-act="approve">Aprovar orçamento</button>`;
    if (state.approved) a += `<div class="done-msg">✓ Orçamento aprovado! A loja já foi avisada e seu pedido entra na produção.</div>`;
    if (wa) a += `<a class="btn ${d.actions.approve && !state.approved ? 'secondary' : 'wa'}" href="${wa}" target="_blank" rel="noopener">${o.status === 'quote' ? 'Quero mudar algo' : 'Falar no WhatsApp'}</a>`;
    return a ? `<section class="stack" style="margin:4px 0 12px">${a}</section>` : '';
  }

  const state = { approved: false, paidSent: false };
  let data;
  function render(d) {
    data = d;
    const o = d.order;
    document.title = `Pedido #${o.number} · ${d.shop.name}`;
    $app.innerHTML =
      `<header class="shop"><div class="mark" aria-hidden="true">${esc(initials(d.shop.name))}</div><div class="shopname">${esc(d.shop.name)}</div></header>` +
      `<p class="hello">Oi, ${esc(o.firstName || 'tudo bem')}!</p><h1>${o.status === 'quote' ? 'Orçamento' : 'Pedido'} #${o.number}</h1>` +
      hero(d) + (o.status === 'cancelled' ? '' : steps(d)) + actions(d, state) + items(d) + money(d, state) +
      `<footer>Atualizado ${ago(d.updatedAt || d.publishedAt)} · esta página se atualiza sozinha</footer>`;
  }

  async function rpc(fn, body) {
    const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: CFG.key, Authorization: `Bearer ${CFG.key}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.text()) || r.status);
    return r.json();
  }
  async function load() {
    if (demo) return;
    if (!token || CFG.url.startsWith('__')) return notFound();
    try {
      const d = await rpc('get_tracking', { p_token: token });
      if (!d) return notFound();
      const evs = d.events || [];
      state.approved = state.approved || (evs.some((e) => e.a === 'approve') && d.order.status === 'quote');
      state.paidSent = state.paidSent || evs.some((e) => e.a === 'paid');
      render(d);
    } catch (e) {
      if (!data) $app.innerHTML = `<div class="empty"><h1 class="wide">Sem conexão</h1><p class="hello">Não deu para carregar agora. Tente de novo em instantes.</p></div>`;
    }
  }
  function notFound() {
    $app.innerHTML = `<div class="empty"><h1 class="wide">Link não encontrado</h1><p class="hello">Ele pode ter expirado. Fale com a loja que ela te manda um novo.</p></div>`;
  }

  // confirmação em folha (bottom sheet)
  function ask(title, text, ok) {
    return new Promise((res) => {
      const sh = document.getElementById('sheet');
      document.getElementById('sheet-t').textContent = title;
      document.getElementById('sheet-p').textContent = text;
      const b = document.getElementById('sheet-ok');
      b.textContent = ok;
      const close = (v) => { sh.classList.remove('show'); b.onclick = null; document.getElementById('sheet-no').onclick = null; res(v); };
      b.onclick = () => close(true);
      document.getElementById('sheet-no').onclick = () => close(false);
      sh.onclick = (e) => e.target === sh && close(false);
      sh.classList.add('show');
      b.focus();
    });
  }

  document.addEventListener('click', async (e) => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      try { await navigator.clipboard.writeText(c.dataset.copy); toast('Copiado! Cole no app do banco.'); } catch { prompt('Copie o código:', c.dataset.copy); }
      return;
    }
    const a = e.target.closest('[data-act]');
    if (!a || !data) return;
    const act = a.dataset.act;
    const ok = act === 'approve'
      ? await ask('Aprovar o orçamento?', `${data.items.map((i) => `${i.qty}× ${i.name}`).join(', ')}${data.money && data.money.priced ? ' — ' + brl(data.money.totalCents) : ''}. A loja recebe o aviso na hora.`, 'Sim, aprovar')
      : await ask('Avisar que você pagou?', 'A loja vai conferir no banco e confirmar.', 'Sim, já paguei');
    if (!ok) return;
    a.disabled = true;
    try {
      if (!demo) await rpc('tracking_act', { p_token: token, p_action: act });
      if (act === 'approve') state.approved = true; else state.paidSent = true;
      render(data);
      toast(act === 'approve' ? 'Aprovado! 🎉' : 'Aviso enviado');
    } catch (err) {
      a.disabled = false;
      toast('Não deu certo. Tente de novo.');
    }
  });

  // prévia dentro do app: recebe os dados prontos
  if (demo) {
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'fc-track-preview') render(e.data.data); });
    if (window.parent !== window) window.parent.postMessage({ type: 'fc-track-ready' }, '*');
  }
  load();
  setInterval(() => document.visibilityState === 'visible' && load(), 60000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
})();
</script>
</body>
</html>
